version: "3.9"

services:
  app:
    build: .
    container_name: kuran-app
    expose:
      - "80"
    environment:
      - VIRTUAL_HOST=kuran-tefsir.duckdns.org
      - LETSENCRYPT_HOST=kuran-tefsir.duckdns.org
      - LETSENCRYPT_EMAIL=your@email.com
    networks:
      - proxy
    restart: always
    
  nginx-proxy:
    image: nginxproxy/nginx-proxy
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs:rw
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
    networks:
      - proxy
    restart: always
    
  letsencrypt:
    image: nginxproxy/acme-companion
    container_name: letsencrypt
    volumes_from:
      - nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - acme:/etc/acme.sh
    environment:
      - DEFAULT_EMAIL=your@email.com
      - NGINX_PROXY_CONTAINER=nginx-proxy
    networks:
      - proxy
    restart: always

networks:
  proxy:
    driver: bridge

volumes:
  certs:
  vhost:
  html:
  acme: