name: Autogenerate data files

on:
  push:
    paths:
      - 'server/data/roots/roots_one_file/**'
  workflow_dispatch:

jobs:
  run_scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # needed for push

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run scripts
        run: |
          cd server/scripts
          python roots_to_all_chapters_translation.py
          python full_chapters_to_surah_files.py
          python full_chapters_to_chapters_files.py
          python roots_to_roots_files.py

      - name: Clean temporary file
        run: rm -f server/data/all_chapters.json

      - name: Commit and push generated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add server/data
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update generated data files"
            git push
          fi

      
